name: Build sb-lxf Android AAR

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'android-aar'
        type: choice
        options:
          - android-aar
          - linux-amd64
          - all

env:
  GO_VERSION: '1.25.5'
  ANDROID_NDK_VERSION: 'r28c'

jobs:
  build-android-aar:
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'android-aar' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          local-cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build libbox AAR
        run: |
          export PATH=$PATH:${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          export ANDROID_HOME=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64
          make lib_android

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-aar
          path: libbox.aar
          retention-days: 30

  build-linux-amd64:
    if: github.event.inputs.target == 'all' || github.event.inputs.target == 'linux-amd64' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux AMD64 binary
        run: |
          go build -tags "with_quic,with_wireguard,with_utls,with_acme,with_clash_api,with_tailscale,with_ccm,with_ocm,with_cloudflared,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0" -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ github.sha }}' -s -w -buildid=" -o sing-box-linux-amd64 ./cmd/sing-box

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box-linux-amd64
          retention-days: 30

  release:
    needs: [build-android-aar, build-linux-amd64]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-android-aar

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-amd64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: sb-lxf v${{ github.run_number }}
          files: |
            libbox.aar
            sing-box-linux-amd64
          draft: true
          prerelease: true

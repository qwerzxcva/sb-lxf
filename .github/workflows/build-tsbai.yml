name: Build sb-lxf Android AAR

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag / AAR version (e.g. v1.15.0-ts.1)'
        required: true
        default: 'v1.15.0-ts.1'
      release:
        description: 'Create a GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  GO_VERSION: '1.25.5'
  ANDROID_NDK_VERSION: 'r28c'

jobs:
  build-android-aar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Build libbox AAR
        run: |
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export PATH=$PATH:$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          echo "NDK: $ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME"
          make lib_android

      - name: Name artifact + SHA256SUMS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AAR="libbox-${VERSION#v}.aar"
          cp libbox.aar "$AAR"
          sha256sum "$AAR" > SHA256SUMS
          echo "$AAR" > AAR_NAME.txt
          echo "$AAR" >> "$GITHUB_ENV"
          echo "Built: $AAR"
          sha256sum "$AAR"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-aar
          path: |
            ${{ env.AAR }}
            SHA256SUMS
          retention-days: 30

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux AMD64 binary
        run: |
          go build -tags "with_quic,with_wireguard,with_utls,with_acme,with_clash_api,with_ccm,with_ocm,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ github.sha }}' -s -w -buildid=" \
            -o sing-box-linux-amd64 ./cmd/sing-box

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box-linux-amd64
          retention-days: 30

  release:
    needs: [build-android-aar, build-linux-amd64]
    if: github.event.inputs.release == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-android-aar
          path: dist

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android-aar.outputs.version }}
          name: sb-lxf ${{ needs.build-android-aar.outputs.version }}
          files: dist/*
          draft: false
          prerelease: true
          fail_on_unmatched_files: false

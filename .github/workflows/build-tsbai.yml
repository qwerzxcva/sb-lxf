name: Build sb-lxf Android AAR

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag / AAR version (e.g. v1.15.0-ts.1)'
        required: true
        default: 'v1.15.0-ts.1'
      release:
        description: 'Create a GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  GO_VERSION: '1.25.5'
  ANDROID_NDK_VERSION: 'r28c'

jobs:
  build-android-aar:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Android NDK + SDK platforms
        uses: android-actions/setup-android@v3
        id: setup-ndk
        with:
          ndk: ${{ env.ANDROID_NDK_VERSION }}
          androidsdk: "platform-tools android-21 android-24"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="v$(date +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: Install gomobile (sagernet fork matching go.mod)
        run: |
          # sb-lxf uses github.com/sagernet/gomobile (a fork), not golang.org/x/mobile.
          # The standard gomobile refuses to build a module that lacks golang.org/x/mobile
          # in its dependency graph, so install the fork instead. FindMobile() checks
          # $GOPATH/bin for both gomobile and gobind.
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          GOMOBILE_BIN="$(go env GOPATH)/bin/gomobile"
          GOBIND_BIN="$(go env GOPATH)/bin/gobind"
          echo "gomobile: $GOMOBILE_BIN"
          echo "gobind:  $GOBIND_BIN"
          "$GOMOBILE_BIN" init || true
          ls "$(go env GOPATH)/bin/" | grep -E 'gomobile|gobind'
          echo "gomobile_bin=$GOMOBILE_BIN" >> "$GITHUB_ENV"
          echo "gobind_bin=$GOBIND_BIN" >> "$GITHUB_ENV"

      - name: Build libbox AAR
        run: |
          # android-actions/setup-android sets ANDROID_HOME to the installed SDK
          # (licenses + platforms + NDK under $ANDROID_HOME/ndk/). findNDK() scans
          # $ANDROID_HOME/ndk/ automatically, so just make sure it's the real one.
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls "$ANDROID_HOME/licenses" "$ANDROID_HOME/platforms" 2>&1 | head
          # Locate the installed NDK (setup-android uses a version dir, not "r28c")
          NDK_DIR="$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          echo "Installed NDK: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
          make lib_android

      - name: Name artifact + SHA256SUMS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AAR="libbox-${VERSION#v}.aar"
          cp libbox.aar "$AAR"
          sha256sum "$AAR" > SHA256SUMS
          echo "$AAR" > AAR_NAME.txt
          echo "$AAR" >> "$GITHUB_ENV"
          echo "Built: $AAR"
          sha256sum "$AAR"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-aar
          path: |
            ${{ env.AAR }}
            SHA256SUMS
          retention-days: 30

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build Linux AMD64 binary
        run: |
          go build -tags "with_quic,with_wireguard,with_utls,with_acme,with_clash_api,with_ccm,with_ocm,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ github.sha }}' -s -w -buildid=" \
            -o sing-box-linux-amd64 ./cmd/sing-box

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: sing-box-linux-amd64
          retention-days: 30

  release:
    needs: [build-android-aar, build-linux-amd64]
    if: github.event.inputs.release == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AAR artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-android-aar
          path: dist

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android-aar.outputs.version }}
          name: sb-lxf ${{ needs.build-android-aar.outputs.version }}
          files: dist/*
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
